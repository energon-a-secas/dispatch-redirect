<title>Dispatch is now Antenne | Neorgon</title>
<meta name="description" content="Dispatch was renamed to Antenne. This page forwards to antenne.neorgon.com, and the feed at /feed.xml points readers at the new one.">
<meta property="og:title" content="Dispatch is now Antenne">
<meta property="og:description" content="Dispatch was renamed to Antenne. This page forwards to antenne.neorgon.com.">

<meta name="twitter:title" content="Dispatch is now Antenne">
<meta name="twitter:description" content="Dispatch was renamed to Antenne. This page forwards to antenne.neorgon.com.">
<!-- Indexable on purpose. noindex would tell a search engine to discard the old
     URL instead of passing its signals to the new one; canonical plus the meta
     refresh is the pair that moves a page. -->
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://antenne.neorgon.com/">
<meta name="theme-color" content="#040714">
<!-- Relative on purpose: a reader auto-discovering on the old host should find
     the local feed, which is the one that names the new feed address. -->
<link rel="alternate" type="application/rss+xml" title="Antenne: Neorgon fleet news" href="/feed.xml">
<meta http-equiv="refresh" content="0; url=https://antenne.neorgon.com/">
<script>
  // Preserve the path so a deep link survives the move, and the hash with it:
  // every story permalink on this site is /#p=<story-id>.
  location.replace('https://antenne.neorgon.com' + location.pathname + location.search + location.hash);
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",

  "name": "Antenne",
  "alternateName": "Dispatch",
  "url": "https://antenne.neorgon.com/",
  "description": "Launches, features, and fixes across the Neorgon fleet, approved at the desk before publishing",
  "publisher": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
}
</script>
<style>
  body { background:#0b0b10; color:#e6e6ef; font:16px/1.6 system-ui,sans-serif;

    <p class="small">Subscribed to the old feed? It now points at
      <a href="https://antenne.neorgon.com/feed.xml">antenne.neorgon.com/feed.xml</a>.</p>
  </main>
